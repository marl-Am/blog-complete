<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
  lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
    <link rel="stylesheet" href="/css/style.css" />
    <link
      th:rel="stylesheet"
      th:href="@{/webjars/bootstrap/5.2.3/css/bootstrap.min.css}" />
    <link rel="stylesheet" th:href="@{/fontawesome/css/all.css}" />
    <script defer th:src="@{/fontawesome/js/all.js}"></script>
    <title>Blog</title>
  </head>
  <body>
    <header class="header p-3 text-bg-dark">
      <div class="container">
        <div
          class="d-flex flex-wrap align-items-center justify-content-center justify-content-lg-start">
          <a
            href="/"
            class="d-flex align-items-center mb-2 mb-lg-0 text-white text-decoration-none">
            <i class="fa-solid fa-feather-pointed"></i>
          </a>

          <ul
            class="nav col-12 col-lg-auto me-lg-auto mb-2 justify-content-center mb-md-0">
            <li><a href="/" class="nav-link px-2 text-white">Home</a></li>
            <li sec:authorize="hasAuthority('ROLE_ADMIN')">
              <a href="/projects" class="nav-link px-2 text-white">Projects</a>
            </li>
            <li>
              <a href="/contact" class="nav-link px-2 text-white">Contact</a>
            </li>
            <div sec:authorize="isAuthenticated()">
              <li>
                <a href="/account" class="nav-link px-2 text-white">Account</a>
              </li>
            </div>
          </ul>

          <div class="text-end">
            <div sec:authorize="!isAuthenticated()">
              <a href="/login" class="btn btn-outline-light me-2">Login</a>
              <a href="/register" class="btn btn-warning">Sign-up</a>
            </div>

            <div sec:authorize="isAuthenticated()">
              <form th:action="@{/logout}" method="POST">
                <button type="submit" class="btn btn-danger">Logout</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </header>
  </body>
</html>
